<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
      :root {
        --primary: #10b981;
        --primary-dark: #059669;
        --bg-color: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #d1d5db;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.18), transparent 30%),
          radial-gradient(circle at 90% 80%, rgba(20, 184, 166, 0.15), transparent 30%),
          linear-gradient(135deg, #ecfdf5, #f8fafc, #eff6ff);
        color: var(--text-color);
        animation: backgroundMove 10s ease-in-out infinite alternate;
      }

      @keyframes backgroundMove {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      .container {
        width: 100%;
        max-width: 420px;
        padding: 38px 35px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        box-shadow:
          0 25px 60px rgba(15, 23, 42, 0.12),
          0 8px 20px rgba(16, 185, 129, 0.08);
        backdrop-filter: blur(15px);
        animation: containerAppear 0.8s ease forwards;
      }

      @keyframes containerAppear {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      h2 {
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
        text-align: center;
        background: linear-gradient(90deg, #059669, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        color: #1f2937;
      }

      input[type="email"] {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      input[type="email"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      }

      button {
        width: 100%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        padding: 0.85rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      }

      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      #message {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 500;
        min-height: 24px;
        padding: 0.5rem;
        border-radius: 6px;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: var(--primary);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color 0.2s;
      }

      .back-link:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Your Password</h2>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Enter your email address</label>
          <input
            type="email"
            id="email"
            required
            placeholder="user@example.com"
          />
        </div>
        <button type="submit" id="submitBtn">Send Reset Link</button>
      </form>

      <p id="message"></p>

      <a href="login.html" class="back-link">Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const API_URL = "http://localhost:3000/api/";
      const form = document.getElementById("forgotForm");
      const messageEl = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";
        messageEl.textContent = "";

        try {
          const response = await axios.post(`${API_URL}auth/forgot`, {
            email,
          });
          messageEl.textContent = response.data.message;
          messageEl.style.color = "#10b981";
          messageEl.style.backgroundColor = "#ecfdf5";
          messageEl.style.border = "1px solid #a7f3d0";
        } catch (error) {
          messageEl.textContent =
            error.response?.data?.message || "Something went wrong.";
          messageEl.style.color = "#dc2626";
          messageEl.style.backgroundColor = "#fee2e2";
          messageEl.style.border = "1px solid #fecaca";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
