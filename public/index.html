<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
  </head>
  <body>
    <div class="container">

      <!-- ===== HEADER ===== -->
      <div class="header-div">
        <h2>💸 Expense Tracker</h2>
        <div>
          <button id="premiumBtn">⭐ Premium - ₹99</button>
          <button id="codBtn" style="display:none;">💵 Cash on Delivery - ₹99</button>
          <button id="logoutBtn" onclick="handleLogout()">🚪 Logout</button>
        </div>
        <div id="premiumMessage"></div>
      </div>

      <!-- ===== EXPENSE FORM ===== -->
      <form id="expenseForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="amount">Expense Amount (₹)</label>
          <input type="number" id="amount" step="0.01" required placeholder="e.g. 250" />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" required placeholder="e.g. Lunch at cafe" />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Auto">🚖 Auto</option>
            <option value="Fuel">⛽ Fuel</option>
            <option value="Food">🍔 Food</option>
            <option value="Drink">🥤 Drink</option>
            <option value="Electricity">💡 Electricity</option>
            <option value="Movie">🎬 Movie</option>
            <option value="Shopping">🛍️ Shopping</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">+ Add Expense</button>

        <div>
          <button type="button" id="leaderboardBtn">🏆 Leaderboard</button>
          <button type="button" id="downloadBtn">📥 Download Report</button>
        </div>
      </form>

      <!-- ===== EXPENSE LIST ===== -->
      <h3>Your Expenses</h3>
      <ul id="expenseList"></ul>

      <!-- ===== PAGINATION ===== -->
      <div class="pagination-container">
        <button id="prevBtn" disabled>← Prev</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" disabled>Next →</button>
      </div>

    </div>

    <!-- ===== LEADERBOARD MODAL ===== -->
    <div id="leaderboardModal" class="leaderboard-modal" style="display:none;">
      <div class="leaderboard-content">
        <button id="closeLeaderboard" class="close-btn">✕</button>
        <h2>🏆 Expense Leaderboard</h2>
        <p>Users who spent the most appear at the top.</p>
        <div id="leaderboardList">Loading...</div>
      </div>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="main.js"></script>
  </body>
</html>
