<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success - Expense Tracker</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0fdf4, #dcfce7);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
      }
      .card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        padding: 3rem 2.5rem;
        text-align: center;
        max-width: 460px;
        width: 90%;
      }
      .icon { font-size: 4rem; margin-bottom: 1rem; }
      h1 { color: #16a34a; font-size: 1.8rem; margin-bottom: 0.5rem; }
      p { color: #555; font-size: 1rem; margin-bottom: 1.5rem; }
      .order-id {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 10px;
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
        color: #15803d;
        margin-bottom: 1.5rem;
        word-break: break-all;
      }
      .btn-home {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border: none;
        padding: 0.8rem 2rem;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.2s;
      }
      .btn-home:hover { transform: translateY(-2px); }
      .verifying { color: #888; font-size: 0.9rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🎉</div>
      <h1>Payment Successful!</h1>
      <p>Thank you! You are now a <strong>Premium member</strong> of Expense Tracker.</p>
      <div class="order-id" id="orderIdBox">Loading order details...</div>
      <p class="verifying" id="verifyMsg">Verifying your payment, please wait...</p>
      <a href="index.html" class="btn-home" id="homeBtn" style="display:none;">Go to Dashboard →</a>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/";

      async function verifyAndActivate() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("order_id");
        const orderIdBox = document.getElementById("orderIdBox");
        const verifyMsg = document.getElementById("verifyMsg");
        const homeBtn = document.getElementById("homeBtn");

        if (!orderId) {
          orderIdBox.textContent = "No order ID found.";
          verifyMsg.textContent = "Unable to verify payment.";
          homeBtn.style.display = "inline-block";
          return;
        }

        orderIdBox.textContent = "Order ID: " + orderId;

        try {
          const storedUser = localStorage.getItem("user");
          const token = localStorage.getItem("token");
          if (!storedUser || !token) {
            verifyMsg.textContent = "Session expired. Please log in again.";
            homeBtn.style.display = "inline-block";
            return;
          }

          const currentUser = JSON.parse(storedUser);

          const response = await fetch(`${API_URL}payment/verify-payment`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ orderId, userId: currentUser.id }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            currentUser.isPremium = true;
            localStorage.setItem("user", JSON.stringify(currentUser));
            verifyMsg.textContent = "✅ Premium activated! Enjoy your benefits.";
          } else {
            verifyMsg.textContent = data.message || "Payment could not be verified. Contact support.";
          }
        } catch (err) {
          console.error("Verification error:", err);
          verifyMsg.textContent = "Network error during verification.";
        }

        homeBtn.style.display = "inline-block";
      }

      verifyAndActivate();
    </script>
  </body>
</html>
